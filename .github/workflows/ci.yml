name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy --strict src/wdlw tests scripts
      - name: Test
        run: pytest -q
      - name: Rebuild annotation guide PDF
        run: python scripts/render_guidelines.py
      - name: Ensure generated PDF is current
        run: git diff --exit-code -- docs/annotation_guidelines.pdf
